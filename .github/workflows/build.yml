name: Build APK
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Tesseract data
        run: |
          mkdir -p app/src/main/assets/tessdata
          curl -sSL -o app/src/main/assets/tessdata/rus.traineddata https://github.com/tesseract-ocr/tessdata/raw/main/rus.traineddata
          curl -sSL -o app/src/main/assets/tessdata/eng.traineddata https://github.com/tesseract-ocr/tessdata_fast/raw/main/eng.traineddata
          ls -la app/src/main/assets/tessdata
      - name: Build
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon 2>&1 | tee build.log || { grep -E "^e: |error:|FAILURE|What went wrong|Could not|> " build.log | head -40 | while read -r l; do echo "::error::$l"; done; exit 1; }
      - run: cp app/build/outputs/apk/debug/app-debug.apk Zal.apk
      - uses: actions/upload-artifact@v4
        with: { name: Zal-apk, path: Zal.apk }
      - name: Publish release
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          TAG="v1.11.${{ github.run_number }}"
          gh release create "$TAG" Zal.apk --title "Зал $TAG" --notes "Установочный файл приложения" --latest
