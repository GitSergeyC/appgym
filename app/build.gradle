plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}
android {
    namespace 'kz.sergey.gym'
    compileSdk 35
    defaultConfig {
        applicationId 'kz.sergey.gym'
        minSdk 26
        targetSdk 34
        versionCode 27
        versionName '1.26'
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }
    }
    signingConfigs {
        fixed {
            storeFile file('zal.keystore')
            storePassword 'zalzal123'
            keyAlias 'zal'
            keyPassword 'zalzal123'
        }
    }
    buildTypes {
        debug { signingConfig signingConfigs.fixed }
    }
    androidResources { noCompress 'traineddata' }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    kotlinOptions { jvmTarget = '17' }
}
dependencies {
    implementation 'com.google.android.gms:play-services-code-scanner:16.1.0'
    implementation 'androidx.health.connect:connect-client:1.1.0-alpha11'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
    implementation 'cz.adaptech.tesseract4android:tesseract4android:4.7.0'
    implementation 'androidx.core:core:1.13.1'
}
