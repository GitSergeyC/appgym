plugins { id 'com.android.application' }
android {
    namespace 'kz.sergey.gym'
    compileSdk 34
    defaultConfig {
        applicationId 'kz.sergey.gym'
        minSdk 24
        targetSdk 34
        versionCode 4
        versionName '1.3'
    }
    signingConfigs {
        fixed {
            storeFile file('zal.keystore')
            storePassword 'zalzal123'
            keyAlias 'zal'
            keyPassword 'zalzal123'
        }
    }
    buildTypes {
        debug { signingConfig signingConfigs.fixed }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
    implementation 'com.google.android.gms:play-services-code-scanner:16.1.0'
}
